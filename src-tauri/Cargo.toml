[package]
name = "compuquiet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Free the machine for games and local AI, then put everything back"

[lib]
name = "compuquiet_lib"
# Desktop only: main.rs links the rlib. The mobile template's staticlib and cdylib
# were built and link-time optimised on every release build for nothing.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cq-core = { workspace = true }
cq-platform = { workspace = true }
dirs = { workspace = true }
log = "0.4"
serde = { workspace = true }
# No `use` names it, but tauri::generate_context! expands to serde_json calls.
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
# Pin the upstream v2 fix that moves Windows update extraction to zip 9.
# crates.io 2.12.0 still resolved zip 4, affected by RUSTSEC-2026-0367/0368/0369/0429.
tauri-plugin-updater = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "74a44c1d5694324b7fb9ba5ee9271a3096da9387" }
time = { version = "0.3", features = ["formatting"] }
tokio = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

# `fake-platform` swaps the OS adapter for an in-memory one so the WebDriver
# suite can drive the real binary without touching real services. Off by
# default, so `tauri build` excludes it; verify.sh asserts a release-config
# build never enables it.
[features]
default = []
fake-platform = ["cq-platform/fake"]
