<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    CompuQuiet: a power ring around a pause mark. The ring is the machine
    (amber, awake); the pause bars are what the app does to everything else.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="330" fill="none" stroke="#2a3446" stroke-width="18"/>
  <path d="M 372 268 A 300 300 0 1 0 652 268" fill="none" stroke="url(#ring)" stroke-width="72" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="404" y="392" width="84" height="240" rx="42" fill="url(#bars)"/>
  <rect x="536" y="392" width="84" height="240" rx="42" fill="url(#bars)"/>
</svg>
