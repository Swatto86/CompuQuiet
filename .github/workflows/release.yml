# Tag-driven release: installers, portable binaries and checksums for
# Windows, Linux and macOS, published after the gate passes on the tagged
# commit. Portable binaries need the documented platform runtimes (WebView2,
# webkit2gtk); see README.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            portable: compuquiet.exe
            suffix: windows-x64.exe
            bundles: nsis
          - os: ubuntu-latest
            portable: compuquiet
            suffix: linux-x64
            bundles: appimage,deb
          - os: macos-latest
            portable: compuquiet
            suffix: macos-arm64
            bundles: dmg,app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify release tag matches app version
        shell: bash
        run: ./scripts/check-release-tag.sh "$GITHUB_REF_NAME"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.os }}
          cache-on-failure: true

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxdo-dev webkit2gtk-driver xvfb dbus-x11

      - name: Pinned native WebDriver
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          bash scripts/setup-tauri-driver.sh
          echo "$PWD/.webdriver" >> "$GITHUB_PATH"

      - name: Match EdgeDriver to WebView2
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/setup-e2e.ps1

      # The gate runs again on the tagged commit: green on the branch is not
      # evidence about the tag if anything landed between them.
      - name: Gate
        shell: bash
        run: ./scripts/verify.sh

      # Default features only: the fake platform is test-only and verify.sh
      # asserts it is not a default feature.
      - name: Build the app
        run: npx --no-install tauri build --bundles ${{ matrix.bundles }}
        env:
          AGENT_RELEASE: "1"
          CARGO_PROFILE_RELEASE_DEBUG: "0"

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          out=release-artifacts
          mkdir -p "$out"
          src="target/release/${{ matrix.portable }}"
          [ -f "$src" ] || { echo "expected executable missing: $src"; exit 1; }
          cp "$src" "$out/CompuQuiet-portable-${{ matrix.suffix }}"
          bundles=$(find target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.dmg' \) 2>/dev/null || true)
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            app=$(find target/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
            [ -n "$app" ] || { echo "no .app bundle was produced"; exit 1; }
            tar -czf "$out/CompuQuiet-portable-${{ matrix.suffix }}.app.tar.gz" -C "$(dirname "$app")" "$(basename "$app")"
          fi
          [ -n "$bundles" ] || { echo "no installer was produced"; exit 1; }
          while IFS= read -r b; do cp "$b" "$out/"; done <<< "$bundles"
          ./scripts/release-checksums.sh "$out" "${{ matrix.suffix }}"
          ls -la "$out"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.suffix }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-artifacts
          pattern: release-*
          merge-multiple: true

      - name: Verify checksums
        shell: bash
        run: cd release-artifacts && sha256sum -c SHA256SUMS-*.txt

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
